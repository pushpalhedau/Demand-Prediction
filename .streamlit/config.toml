[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f3f4f6"
font = "sans serif"

[server]
headless = true
# Cross-site request protections stay ON (these are also Streamlit's defaults; pinned so nobody switches them off).
enableXsrfProtection = true
enableCORS = true
# Uploads are an operator feature: the customer app accepts almost nothing. The admin console is started with
# --server.maxUploadSize=500 (see docker-compose.yml).
maxUploadSize = 1
enableStaticServing = false

[client]
# Never show exception messages or stack traces in the browser; they are logged server-side instead.
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[logger]
level = "info"
