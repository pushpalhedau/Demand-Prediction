[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictax"
version = "2.0.0"
description = "PredictaX: multi-tenant demand intelligence platform for automobile dealer groups"
requires-python = ">=3.11"
# Runtime dependencies live in requirements/base.txt so Docker can install them without the source tree.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/base.txt"] }

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "scripts/generate_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = [
    "E501",   # long lines: formatter's job
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
