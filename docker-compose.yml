# PredictaX stack. Everything here is free and open source.
#
#   Local development :  docker compose up -d db auth        (the apps then run from your own Python environment)
#   Full stack        :  docker compose up -d --build     (new dashboard on :3000, classic on :8501, console on :8502)
#
# Secure defaults: every published port is bound to localhost only, containers run as a non-root user with all
# capabilities dropped and a read-only filesystem, and secrets come from the environment. The fallback values
# below are DEVELOPMENT ONLY; the application refuses to start with them when ENVIRONMENT=production.

x-app: &app
  build: .
  image: predictax-app:latest
  env_file: .env
  environment: &app-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DATABASE_URL: postgresql+psycopg2://predictax_app:${APP_DB_PASSWORD:-predictax_app_dev}@db:5432/predictax
    ADMIN_DATABASE_URL: postgresql+psycopg2://predictax_owner:${OWNER_DB_PASSWORD:-predictax_owner_dev}@db:5432/predictax
    UPLOAD_DIR: /data/uploads
    MODEL_DIR: /app/models
    AUTH_BASE_URL: http://auth:9999
    SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-predictax-dev-jwt-secret-change-me-0123456789abcdef}
    REDIS_URL: redis://:${REDIS_PASSWORD:-predictax_redis_dev}@redis:6379/0
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - uploads:/data/uploads
    - models:/app/models
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predictax_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:-predictax_owner_dev}
      POSTGRES_DB: predictax
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-predictax_app_dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_pw}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictax_owner -d predictax"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: supabase/gotrue:v2.170.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-auth_dev_pw}@db:5432/predictax?search_path=auth
      GOTRUE_SITE_URL: http://localhost:8501
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-predictax-dev-jwt-secret-change-me-0123456789abcdef}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      # Accounts are created by operators only: public sign-up is off.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Development convenience: no email server needed. In production configure SMTP and turn this OFF.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-predictax_redis_dev}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-predictax_redis_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["rq", "worker", "ingest", "--url", "redis://:${REDIS_PASSWORD:-predictax_redis_dev}@redis:6379/0"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true      # no HTTP server in the worker

  api:
    # JSON API behind the new dashboard. Not published: only the frontend container talks to it.
    <<: *app
    command: ["uvicorn", "backend.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    # The new dashboard (Next.js). Proxies /api to the api service, so the browser only sees one origin.
    build: ./web
    image: predictax-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    # Classic Streamlit dashboard: kept while the remaining tabs move to the new one.
    <<: *app
    command: ["streamlit", "run", "frontend/customer_app/main.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

  admin:
    # Operator-only console (accounts, data import, training, audit log). Published on localhost ONLY: never
    # expose this port publicly; reach it over a VPN or SSH tunnel.
    <<: *app
    command: ["streamlit", "run", "frontend/admin_console/main.py", "--server.port=8502", "--server.address=0.0.0.0",
              "--server.maxUploadSize=500"]
    environment:
      <<: *app-env
      PORT: "8502"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8502:8502"

volumes:
  pgdata:
  redisdata:
  uploads:
  models:
