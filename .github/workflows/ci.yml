name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements/lock.txt
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check backend frontend tests
      - name: Static security scan (medium and above must be clean)
        run: bandit -r backend frontend -ll -q
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements/lock.txt --no-deps --disable-pip
      - name: Unit tests (no services needed)
        run: pytest -m unit -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
